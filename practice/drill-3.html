<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drill 3 - Fixed snippets</title>
</head>
<body>
  <h1>Drill 3 - Fixed snippets</h1>

  <!-- Snippet 1: h1 -> h3 skipped a level; now h2 -->
  <h2>Our routes</h2>
  <h2>Kiserian route</h2>

  <!-- Snippet 2: img had no alt text -->
  <img src="../img/first-cooler.jpg" alt="The sacco's first milk cooler">

  <!-- Snippet 3: tags were overlapping; now properly nested -->
  <p>Milk is paid <strong>once a month.</strong></p>

  <!-- Snippet 4: label's for must match the input's id -->
  <label for="phone">Phone number</label>
  <input type="tel" id="phone" name="phone">

  <!-- Snippet 5: second row was missing the Accepted cell -->
  <table>
    <caption>Deliveries</caption>
    <thead>
      <tr>
        <th scope="col">Member</th>
        <th scope="col">Litres</th>
        <th scope="col">Accepted</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>ER-0001</td>
        <td>5.38</td>
        <td>Yes</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
